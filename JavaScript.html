<script>
  let currentUser = JSON.parse(localStorage.getItem('dhamma_user')) || null;
  let allQuizData = { tri: [], tho: [], ek: [] };
  let isQuizDataLoaded = false;
  let currentLevel = '';
  let currentSubject = '';
  let selectedQuestionLimit = 10;
  let activeQuizList = [];
  let userAnswers = {};
  let currentQuestionIndex = 0;
  let quizTimerInterval = null;
  let timeLeftSeconds = 0;
  let globalLeaderboardData = [];
  let currentLeaderboardTab = 'all';

  window.addEventListener('DOMContentLoaded', () => {
    renderNav();
    loadQuizData();
    loadLeaderboard();
    setQuestionAmount(10);
    switchTab('quiz-select');
  });

  // แจ้งเตือนเมื่อพยายามปิดหรือรีเฟรชเบราว์เซอร์ขณะทำข้อสอบ
  window.addEventListener('beforeunload', (e) => {
    const secQuiz = document.getElementById('sec-quiz');
    if (secQuiz && !secQuiz.classList.contains('hidden')) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function confirmExitQuiz(callback) {
    const secQuiz = document.getElementById('sec-quiz');
    if (secQuiz && !secQuiz.classList.contains('hidden')) {
      Swal.fire({
        title: 'ต้องการออกจากแบบทดสอบ?',
        text: 'คำตอบที่ทำไว้จะไม่ถูกบันทึก',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ออกจากข้อสอบ',
        cancelButtonText: 'ทำต่อ'
      }).then(res => {
        if (res.isConfirmed) {
          clearInterval(quizTimerInterval);
          document.getElementById('sec-quiz').classList.add('hidden');
          document.getElementById('mobile-bottom-nav').classList.remove('hidden');
          callback();
        }
      });
    } else {
      callback();
    }
  }

  function showLoading(msg = 'กำลังโหลดข้อมูล...') {
    const txt = document.getElementById('loading-text');
    if (txt) txt.innerText = msg;
    document.getElementById('loading-spinner').classList.remove('hidden');
  }
  
  function hideLoading() {
    document.getElementById('loading-spinner').classList.add('hidden');
  }

  // ฟังก์ชันสลับหน้าหลัก (4 Tabs)
  function switchTab(tabId) {
    if (!currentUser && (tabId === 'history' || tabId === 'profile')) {
      Swal.fire({ icon: 'warning', title: 'กรุณาเข้าสู่ระบบ', text: 'โปรดเข้าสู่ระบบเพื่อเข้าถึงหน้านี้' });
      showAuthSection(true);
      return;
    }

    showAuthSection(false);

    // ซ่อนทุกหน้าก่อน
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById('sec-subject').classList.add('hidden');
    document.getElementById('sec-quiz').classList.add('hidden');
    document.getElementById('sec-result').classList.add('hidden');

    // แสดงหน้าเป้าหมาย
    const targetTab = document.getElementById(`tab-${tabId}`);
    if (targetTab) targetTab.classList.remove('hidden');

    // อัปเดตสถานะปุ่มใน Bottom Nav
    document.querySelectorAll('.nav-tab-btn').forEach(btn => btn.classList.remove('active'));
    const activeNavBtn = document.getElementById(`nav-btn-${tabId}`);
    if (activeNavBtn) activeNavBtn.classList.add('active');

    document.getElementById('mobile-bottom-nav').classList.remove('hidden');

    // โหลดข้อมูลตามหน้าที่เลือก
    if (tabId === 'history' || tabId === 'profile') {
      loadUserDashboard();
    } else if (tabId === 'leaderboard') {
      loadLeaderboard();
    }
  }

  function showAuthSection(show) {
    const authSec = document.getElementById('sec-auth');
    if (show) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      authSec.classList.remove('hidden');
    } else {
      authSec.classList.add('hidden');
    }
  }

  function renderNav() {
    const container = document.getElementById('nav-user-area');
    if (!container) return;

    if (currentUser) {
      // ดึงคะแนนสะสมและจำนวนไฟจาก localStorage (ถ้ายังไม่มีให้เป็น 0)
      const accumScore = currentUser.accumScore || 0;
      const streakCount = currentUser.streakCount || 0;

      container.innerHTML = `
        <div class="flex items-center space-x-1.5 sm:space-x-2">
          
          <!-- 1. ไอคอนไฟความต่อเนื่อง (Streak Fire) -->
          <div class="flex items-center space-x-1 bg-[#FFF2E5] text-[#E06D53] border border-[#FCDCC7] px-2.5 py-1 rounded-xl text-xs font-bold shadow-sm" title="ความต่อเนื่องในการทำข้อสอบ">
            <i class="fa-solid fa-fire animate-pulse text-sm text-[#E06D53]"></i>
            <span id="nav-streak-count">${streakCount}</span>
          </div>

          <!-- 2. คะแนนสะสมรวม -->
          <div class="flex items-center space-x-1 bg-[#FFF2E5] text-[#C88A6E] border border-[#FCDCC7] px-2.5 py-1 rounded-xl text-xs font-bold shadow-sm" title="คะแนนสะสมทั้งหมด">
            <i class="fa-solid fa-star text-xs text-[#C88A6E]"></i>
            <span id="nav-accum-score">${accumScore}</span>
            <span class="hidden sm:inline text-[10px] text-[#A89288] font-normal">คะแนน</span>
          </div>

          <!-- 3. ชื่อผู้ใช้งาน -->
          <button type="button" onclick="confirmExitQuiz(() => switchTab('profile'))" class="flex items-center space-x-1.5 bg-[#FFF2E5] text-[#6E493B] border border-[#F5E6D8] px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-[#FCDCC7] transition shadow-sm">
            <i class="fa-solid fa-circle-user text-[#C88A6E] text-sm"></i>
            <span class="max-w-[80px] sm:max-w-[120px] truncate">${currentUser.nickname || currentUser.fullname}</span>
          </button>

          <!-- 4. ปุ่มออกจากระบบ -->
          <button type="button" onclick="confirmExitQuiz(handleLogout)" class="text-[#A89288] hover:text-[#6E493B] p-1.5 rounded-xl text-sm transition" title="ออกจากระบบ">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>

        </div>
      `;
    } else {
      container.innerHTML = `
        <button type="button" onclick="confirmExitQuiz(() => showAuthSection(true))" class="bg-[#6E493B] text-white font-medium px-4 py-1.5 rounded-xl text-sm shadow-sm hover:bg-[#54392D] transition">เข้าสู่ระบบ</button>
      `;
    }
  }

  function switchAuthTab(tab) {
    const btnLogin = document.getElementById('btn-tab-login');
    const btnReg = document.getElementById('btn-tab-register');
    const formLogin = document.getElementById('form-login');
    const formReg = document.getElementById('form-register');

    if (tab === 'login') {
      btnLogin.className = "flex-1 py-3 text-center font-semibold text-[#6E493B] border-b-2 border-[#6E493B]";
      btnReg.className = "flex-1 py-3 text-center font-semibold text-[#A89288]";
      formLogin.classList.remove('hidden');
      formReg.classList.add('hidden');
    } else {
      btnReg.className = "flex-1 py-3 text-center font-semibold text-[#6E493B] border-b-2 border-[#6E493B]";
      btnLogin.className = "flex-1 py-3 text-center font-semibold text-[#A89288]";
      formReg.classList.remove('hidden');
      formLogin.classList.add('hidden');
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('login-username').value;
    const p = document.getElementById('login-password').value;

    showLoading('กำลังเข้าสู่ระบบ...');
    google.script.run.withSuccessHandler(res => {
      hideLoading();
      if (res && res.status === 'success') {
        currentUser = res.user;
        localStorage.setItem('dhamma_user', JSON.stringify(currentUser));
        renderNav();
        switchTab('quiz-select');
        Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1500, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message || 'เกิดข้อผิดพลาด' });
      }
    }).withFailureHandler(err => {
      hideLoading();
      Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.toString() });
    }).loginUser(u, p);
  }

  function handleRegister(e) {
    e.preventDefault();
    const data = {
      username: document.getElementById('reg-username').value,
      password: document.getElementById('reg-password').value,
      fullname: document.getElementById('reg-fullname').value,
      nickname: document.getElementById('reg-nickname').value,
      classroom: document.getElementById('reg-classroom').value,
      no: document.getElementById('reg-no').value,
      school: document.getElementById('reg-school').value
    };

    showLoading('กำลังลงทะเบียน...');
    google.script.run.withSuccessHandler(res => {
      hideLoading();
      if (res && res.status === 'success') {
        currentUser = res.user;
        localStorage.setItem('dhamma_user', JSON.stringify(currentUser));
        renderNav();
        switchTab('quiz-select');
        Swal.fire({ icon: 'success', title: 'สมัครสมาชิกสำเร็จ', timer: 1500, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message || 'เกิดข้อผิดพลาด' });
      }
    }).registerUser(data);
  }

  function handleUpdateProfile(e) {
    e.preventDefault();
    if (!currentUser) return;

    const data = {
      username: currentUser.username,
      fullname: document.getElementById('edit-fullname').value,
      nickname: document.getElementById('edit-nickname').value,
      classroom: document.getElementById('edit-classroom').value,
      no: document.getElementById('edit-no').value,
      school: document.getElementById('edit-school').value,
      password: document.getElementById('edit-password').value
    };

    showLoading('กำลังบันทึกโปรไฟล์...');
    google.script.run.withSuccessHandler(res => {
      hideLoading();
      if (res && res.status === 'success') {
        currentUser = res.user;
        localStorage.setItem('dhamma_user', JSON.stringify(currentUser));
        renderNav();
        Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลเรียบร้อย', timer: 1500, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message || 'เกิดข้อผิดพลาด' });
      }
    }).updateUserProfile(data);
  }

  function handleLogout() {
    currentUser = null;
    localStorage.removeItem('dhamma_user');
    renderNav();
    showAuthSection(true);
  }

  // 1. ฟังก์ชันสำหรับคำนวณ Streak ไฟ (ดับเมื่อไม่เข้าทำติดต่อกัน)
  function calculateStreak(historyList) {
    if (!historyList || historyList.length === 0) return 0;

    const getDateString = (timeStr) => {
      const parts = timeStr.split(',')[0].trim().split('/');
      if (parts.length < 3) return null;
      let day = parts[0].padStart(2, '0');
      let month = parts[1].padStart(2, '0');
      let year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
      return `${year}-${month}-${day}`;
    };

    const uniqueDates = [];
    historyList.forEach(item => {
      const dStr = getDateString(item.timestamp);
      if (dStr && !uniqueDates.includes(dStr)) {
        uniqueDates.push(dStr);
      }
    });

    if (uniqueDates.length === 0) return 0;

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];

    const lastActiveDate = uniqueDates[0];

    // ขาดทำข้อสอบทั้งวันนี้และเมื่อวาน = ไฟดับ (Streak = 0)
    if (lastActiveDate !== todayStr && lastActiveDate !== yesterdayStr) {
      return 0;
    }

    let streak = 0;
    let checkDate = new Date(lastActiveDate);

    for (let i = 0; i < uniqueDates.length; i++) {
      const activeD = uniqueDates[i];
      const expectedD = checkDate.toISOString().split('T')[0];

      if (activeD === expectedD) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else {
        break;
      }
    }

    return streak;
  }

  // 2. ฟังก์ชันโหลดข้อมูล User Dashboard
  function loadUserDashboard() {
    if (!currentUser) return;
    showLoading('กำลังดึงข้อมูล...');

    google.script.run.withSuccessHandler(res => {
      hideLoading();
      if (res && res.status === 'success') {
        const p = res.profile;

        // 1. ดึงไฟเฉพาะครั้งที่ทำข้อสอบผ่านเกณฑ์ (qualifyingCount)
        const streakCount = res.stats.qualifyingCount || 0;
        const accumScore = res.stats.accumulatedScore || 0;

        currentUser.accumScore = accumScore;
        currentUser.streakCount = streakCount;
        localStorage.setItem('dhamma_user', JSON.stringify(currentUser));

        // 2. อัปเดตตัวเลขบน Navbar
        const navScore = document.getElementById('nav-accum-score');
        const navStreak = document.getElementById('nav-streak-count');
        if (navScore) navScore.innerText = accumScore;
        if (navStreak) navStreak.innerText = streakCount;

        // 3. อัปเดตข้อมูลส่วนหัวหน้า History
        const dFullname = document.getElementById('dash-user-fullname');
        const dNickname = document.getElementById('dash-user-nickname');
        const dSchoolInfo = document.getElementById('dash-user-school-info');

        if (dFullname) dFullname.innerText = p.fullname || 'ผู้ใช้งาน';
        if (dNickname) dNickname.innerText = p.nickname ? `(${p.nickname})` : '';
        if (dSchoolInfo) dSchoolInfo.innerText = `ชั้น ${p.classroom || '-'} เลขที่ ${p.no || '-'} | ${p.school || '-'}`;

        // 4. อัปเดตตัวเลขสถิติ (แสดงจำนวนครั้งที่ทำทั้งหมด)
        const dashAccum = document.getElementById('dash-accum-score');
        const dashTotal = document.getElementById('dash-total-attempts');
        if (dashAccum) dashAccum.innerText = accumScore;
        if (dashTotal) dashTotal.innerText = res.stats.totalAttempts;

        renderHistoryTable(res.history);
      }
    }).getUserDashboardData(currentUser.username);
  }

  function renderHistoryTable(historyList) {
    const tbody = document.getElementById('user-history-tbody');
    if (!tbody) return;

    if (!historyList || historyList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-[#A89288]">ยังไม่มีประวัติการทำข้อสอบ</td></tr>`;
      return;
    }

    const totalCount = historyList.length;

    tbody.innerHTML = historyList.map((item, idx) => {
      // คำนวณลำดับครั้งที่ (เช่น ทำทั้งหมด 3 ครั้ง -> แถวล่าสุดคือ ครั้งที่ 3)
      const attemptNumber = totalCount - idx;

      // จัดฟอร์แมตวันเวลา: จาก "27/08/2026, 15:56:27" หรือ ISO -> "27/08/26, 15:56"
      let formattedDate = item.timestamp || '-';
      if (formattedDate !== '-') {
        // ตัดวินาทีออก (:27) และตัดปีค.ศ. (2026 -> 26)
        formattedDate = formattedDate
          .replace(/(\d{2}\/\d{2}\/)20(\d{2})/, '$1$2') // เปลี่ยน /2026/ เป็น /26/
          .replace(/(:\d{2}):\d{2}$/, '$1');            // ตัด :วินาที ออก
      }

      const qualifyBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#EAF2ED] text-[#4F7262] border border-[#C6E2D1]">+${item.score}</span>`;

      return `
        <tr class="hover:bg-[#FFFBF7] transition border-b border-[#F5E6D8]">
          <td class="px-2 py-3 text-center font-bold text-[#8A756C] text-xs whitespace-nowrap">${attemptNumber}</td>
          <td class="px-3 py-3 text-xs text-[#8A756C] whitespace-nowrap">${formattedDate}</td>
          <td class="px-3 py-3 text-xs font-semibold text-[#6E493B] whitespace-nowrap">${item.level}</td>
          <td class="px-3 py-3 text-xs text-[#54392D]">${item.subject}</td>
          <td class="px-3 py-3 text-center whitespace-nowrap">
            <span class="font-bold text-[#C88A6E] text-xs">${item.score}/${item.total}</span>
            <span class="text-[10px] text-[#A89288] block">(${item.percent}%)</span>
          </td>
          <td class="px-3 py-3 text-center whitespace-nowrap">${qualifyBadge}</td>
        </tr>
      `;
    }).join('');
  }

  function loadQuizData() {
    google.script.run.withSuccessHandler(res => {
      allQuizData = res || { tri: [], tho: [], ek: [] };
      isQuizDataLoaded = true;
    }).getAllQuizData();
  }

  function selectLevel(levelKey) {
    if (!currentUser) {
      Swal.fire({ icon: 'warning', title: 'กรุณาเข้าสู่ระบบ', text: 'ต้องเข้าสู่ระบบก่อนเริ่มทำข้อสอบ' });
      showAuthSection(true);
      return;
    }

    currentLevel = levelKey;
    const levelNames = { tri: 'ธรรมศึกษาชั้นตรี', tho: 'ธรรมศึกษาชั้นโท', ek: 'ธรรมศึกษาชั้นเอก' };
    document.getElementById('selected-level-title').innerText = levelNames[levelKey];

    const subjects = ['ธรรมวิภาค', 'พุทธประวัติ', 'วินัย', 'รวมทุกวิชา'];
    const container = document.getElementById('subject-cards-container');

    container.innerHTML = subjects.map(subj => `
      <div onclick="startQuiz('${subj}')" class="bg-white p-5 rounded-3xl shadow-sm border border-[#F5E6D8] hover:border-[#C88A6E] cursor-pointer flex justify-between items-center">
        <div>
          <h4 class="font-bold text-lg text-[#54392D]">${subj}</h4>
          <p class="text-xs text-[#A89288] mt-1">แบบทดสอบหมวดหมู่ ${subj}</p>
        </div>
        <i class="fa-solid fa-chevron-right text-[#D4C4B7]"></i>
      </div>
    `).join('');

    showSubjectSelection(true);
  }

  function showSubjectSelection(show) {
    if (show) {
      document.getElementById('tab-quiz-select').classList.add('hidden');
      document.getElementById('sec-subject').classList.remove('hidden');
    } else {
      document.getElementById('sec-subject').classList.add('hidden');
      document.getElementById('tab-quiz-select').classList.remove('hidden');
    }
  }

  function setQuestionAmount(amount) {
    selectedQuestionLimit = amount;
    document.querySelectorAll('.btn-qcount').forEach(btn => {
      btn.className = "btn-qcount py-2 rounded-xl border border-[#F5E6D8] font-bold text-[#6E493B] text-center text-sm";
    });
    const activeBtn = document.getElementById(`btn-count-${amount}`);
    if (activeBtn) {
      activeBtn.className = "btn-qcount py-2 rounded-xl border-2 border-[#C88A6E] bg-[#FFF2E5] font-bold text-[#C88A6E] text-center text-sm shadow-sm";
    }
  }

  function startQuiz(subject) {
    if (!isQuizDataLoaded) {
      showLoading('กำลังเตรียมข้อสอบ...');
      setTimeout(() => { hideLoading(); startQuiz(subject); }, 400);
      return;
    }

    currentSubject = subject;
    let rawList = allQuizData[currentLevel] || [];
    if (subject !== 'รวมทุกวิชา') {
      rawList = rawList.filter(q => q.subject === subject);
    }

    if (rawList.length === 0) {
      Swal.fire({ icon: 'info', title: 'ขออภัย', text: 'ไม่พบชุดข้อสอบในวิชานี้' });
      return;
    }

    const shuffled = [...rawList].sort(() => 0.5 - Math.random());
    activeQuizList = shuffled.slice(0, Math.min(selectedQuestionLimit, shuffled.length));

    userAnswers = {};
    currentQuestionIndex = 0;

    const levelNames = { tri: 'ชั้นตรี', tho: 'ชั้นโท', ek: 'ชั้นเอก' };
    document.getElementById('quiz-badge-level').innerText = levelNames[currentLevel];
    document.getElementById('quiz-badge-subject').innerText = currentSubject;
    document.getElementById('quiz-total-num').innerText = activeQuizList.length;

    startTimer(activeQuizList.length * 60);
    renderQuestion();

    document.getElementById('sec-subject').classList.add('hidden');
    document.getElementById('mobile-bottom-nav').classList.add('hidden');
    document.getElementById('sec-quiz').classList.remove('hidden');
  }

  function startTimer(durationSeconds) {
    clearInterval(quizTimerInterval);
    timeLeftSeconds = durationSeconds;
    updateTimerDisplay();

    quizTimerInterval = setInterval(() => {
      timeLeftSeconds--;
      updateTimerDisplay();
      if (timeLeftSeconds <= 0) {
        clearInterval(quizTimerInterval);
        Swal.fire({ title: 'หมดเวลาทำข้อสอบ', text: 'ระบบกำลังส่งคำตอบอัตโนมัติ', icon: 'warning' }).then(() => processSubmit());
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.floor(timeLeftSeconds / 60);
    const s = timeLeftSeconds % 60;
    document.getElementById('quiz-timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function renderQuestion() {
    const q = activeQuizList[currentQuestionIndex];
    document.getElementById('quiz-current-num').innerText = currentQuestionIndex + 1;
    document.getElementById('quiz-question-title').innerText = `${currentQuestionIndex + 1}. ${q.title}`;

    const answeredCount = Object.keys(userAnswers).length;
    document.getElementById('quiz-answered-num').innerText = answeredCount;
    document.getElementById('quiz-progress-bar').style.width = `${(answeredCount / activeQuizList.length) * 100}%`;

    const container = document.getElementById('quiz-options-container');
    container.innerHTML = q.options.map((opt, idx) => {
      const isSelected = userAnswers[currentQuestionIndex] === idx;
      const activeStyle = isSelected ? 'border-[#C88A6E] bg-[#FFF2E5] ring-2 ring-[#C88A6E]/20' : 'border-[#F5E6D8] bg-white';
      const checkIcon = isSelected ? '<i class="fa-solid fa-circle-check text-[#C88A6E] text-lg"></i>' : '<i class="fa-regular fa-circle text-[#D4C4B7] text-lg"></i>';

      return `
        <div onclick="selectAnswer(${idx})" class="p-4 rounded-2xl border ${activeStyle} cursor-pointer transition flex items-center justify-between space-x-3">
          <span class="text-[#54392D] font-medium leading-snug">${opt}</span>
          ${checkIcon}
        </div>
      `;
    }).join('');

    renderNumberNavGrid();

    document.getElementById('btn-prev-q').disabled = (currentQuestionIndex === 0);
    if (currentQuestionIndex === activeQuizList.length - 1) {
      document.getElementById('btn-next-q').classList.add('hidden');
      document.getElementById('btn-submit-q').classList.remove('hidden');
    } else {
      document.getElementById('btn-next-q').classList.remove('hidden');
      document.getElementById('btn-submit-q').classList.add('hidden');
    }
  }

  function renderNumberNavGrid() {
    const container = document.getElementById('quiz-nav-grid');
    container.innerHTML = activeQuizList.map((_, idx) => {
      const isCurrent = (idx === currentQuestionIndex);
      const isAnswered = (userAnswers[idx] !== undefined);

      let btnStyle = "bg-[#FFF9F2] text-[#8A756C] border-[#F5E6D8]";
      if (isAnswered) btnStyle = "bg-[#8EA89D] text-white font-bold border-transparent";
      if (isCurrent) btnStyle += " ring-2 ring-[#C88A6E] ring-offset-2 font-extrabold";

      return `
        <button type="button" onclick="goToQuestion(${idx})" class="w-9 h-9 min-w-[2.25rem] rounded-xl text-xs font-semibold flex items-center justify-center border transition ${btnStyle}">
          ${idx + 1}
        </button>
      `;
    }).join('');
  }

  function goToQuestion(index) {
    currentQuestionIndex = index;
    renderQuestion();
  }

  function selectAnswer(optIdx) {
    userAnswers[currentQuestionIndex] = optIdx;
    renderQuestion();
  }

  function navigateQuiz(step) {
    currentQuestionIndex += step;
    renderQuestion();
  }

  function submitQuizToServer() {
    const answeredCount = Object.keys(userAnswers).length;
    if (answeredCount < activeQuizList.length) {
      Swal.fire({
        title: 'ยังตอบไม่ครบทุกข้อ',
        text: `คุณตอบไปแล้ว ${answeredCount} จาก ${activeQuizList.length} ข้อ ยืนยันที่จะส่งข้อสอบ?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ส่งข้อสอบ',
        cancelButtonText: 'กลับไปทำต่อ'
      }).then(res => { if (res.isConfirmed) processSubmit(); });
    } else {
      processSubmit();
    }
  }

  function processSubmit() {
    clearInterval(quizTimerInterval);
    showLoading('กำลังตรวจคะแนนและบันทึกผล...');

    const answersArray = activeQuizList.map((q, idx) => ({
      id: q.id,
      selectedIndex: userAnswers[idx] !== undefined ? userAnswers[idx] : -1
    }));

    const payload = {
      levelKey: currentLevel,
      userAnswers: answersArray,
      username: currentUser.username,
      subject: currentSubject
    };

    google.script.run.withSuccessHandler(res => {
      hideLoading();
      if (res && res.status === 'success') {
        renderResult(res);
        loadLeaderboard();
      } else {
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message || 'ตรวจข้อสอบไม่สำเร็จ' });
      }
    }).submitAndGradeQuiz(payload);
  }

  function renderResult(res) {
    const percent = ((res.score / res.total) * 100).toFixed(1);
    document.getElementById('result-score-text').innerText = `${res.score} / ${res.total}`;
    document.getElementById('result-percent-text').innerText = `คิดเป็น ${percent}%`;

    const container = document.getElementById('result-review-container');
    container.innerHTML = res.details.map((detail, idx) => {
      const q = activeQuizList[idx];
      const userSelectedIdx = userAnswers[idx];
      const isCorrect = detail.isCorrect;

      const statusBadge = isCorrect 
        ? `<span class="px-2.5 py-1 bg-[#EAF2ED] text-[#4F7262] rounded-full text-xs font-bold"><i class="fa-solid fa-check me-1"></i>ถูกต้อง</span>`
        : `<span class="px-2.5 py-1 bg-[#F9ECEC] text-[#A25757] rounded-full text-xs font-bold"><i class="fa-solid fa-xmark me-1"></i>ตอบผิด</span>`;

      const userText = userSelectedIdx !== undefined ? q.options[userSelectedIdx] : 'ไม่ได้ตอบ';

      return `
        <div class="pt-4 space-y-2">
          <div class="flex justify-between items-start">
            <h4 class="font-semibold text-[#54392D]">${idx + 1}. ${q.title}</h4>
            ${statusBadge}
          </div>
          <p class="text-sm text-[#6E493B]">คำตอบของคุณ: <span class="${isCorrect ? 'text-[#4F7262] font-semibold' : 'text-[#A25757] font-semibold'}">${userText}</span></p>
          ${!isCorrect ? `<p class="text-sm text-[#4F7262]">คำตอบที่ถูกต้อง: <span class="font-semibold">${detail.correctAnswerText}</span></p>` : ''}
          ${detail.exp ? `<p class="text-xs text-[#8A756C] bg-[#FFF9F2] p-2.5 rounded-xl mt-1 border border-[#F5E6D8]"><i class="fa-solid fa-lightbulb text-[#DDB06D] me-1"></i>${detail.exp}</p>` : ''}
        </div>
      `;
    }).join('');

    document.getElementById('sec-quiz').classList.add('hidden');
    document.getElementById('mobile-bottom-nav').classList.remove('hidden');
    document.getElementById('sec-result').classList.remove('hidden');
  }

  function loadLeaderboard() {
    const tbody = document.getElementById('leaderboard-tbody');
    if (tbody) tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-[#A89288]">กำลังโหลดข้อมูล...</td></tr>`;

    google.script.run.withSuccessHandler(list => {
      globalLeaderboardData = list || [];
      renderLeaderboardTable();
    }).getLeaderboard();
  }

  function filterLeaderboard(levelCategory) {
    currentLeaderboardTab = levelCategory;
    const tabs = { 'all': 'tab-lb-all', 'ชั้นตรี': 'tab-lb-tri', 'ชั้นโท': 'tab-lb-tho', 'ชั้นเอก': 'tab-lb-ek' };

    Object.keys(tabs).forEach(key => {
      const btn = document.getElementById(tabs[key]);
      if (btn) {
        btn.className = (key === levelCategory)
          ? "px-3.5 py-1.5 rounded-xl bg-white text-[#6E493B] font-bold shadow-sm border border-[#F5E6D8]"
          : "px-3.5 py-1.5 rounded-xl text-[#6E493B]/70 font-medium";
      }
    });
    renderLeaderboardTable();
  }

  function renderLeaderboardTable() {
    const tbody = document.getElementById('leaderboard-tbody');
    if (!tbody) return;

    let filteredList = globalLeaderboardData;
    if (currentLeaderboardTab !== 'all') {
      filteredList = globalLeaderboardData.filter(item => item.level === currentLeaderboardTab);
    }

    if (!filteredList || filteredList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-[#A89288]">ยังไม่มีข้อมูลในหมวดนี้</td></tr>`;
      return;
    }

    tbody.innerHTML = filteredList.map((item, idx) => {
      let rankBadge = `<span class="font-semibold text-[#8A756C] text-xs">${idx + 1}</span>`;
      if (idx === 0) rankBadge = `<span class="w-6 h-6 inline-flex items-center justify-center bg-[#DDB06D] text-white font-bold rounded-full text-[10px]"><i class="fa-solid fa-trophy"></i></span>`;
      if (idx === 1) rankBadge = `<span class="w-6 h-6 inline-flex items-center justify-center bg-[#C0C7CE] text-white font-bold rounded-full text-[10px]">2</span>`;
      if (idx === 2) rankBadge = `<span class="w-6 h-6 inline-flex items-center justify-center bg-[#C88A6E] text-white font-bold rounded-full text-[10px]">3</span>`;

      return `
        <tr class="hover:bg-[#FFFBF7] border-b border-[#F5E6D8]">
          <td class="px-1 py-2.5 text-center">${rankBadge}</td>
          <td class="px-2 py-2.5 text-xs font-medium text-[#54392D]">
            ${item.fullname} <span class="text-[10px] text-[#A89288]">(${item.nickname})</span>
          </td>
          <td class="px-2 py-2.5 text-xs text-[#6E493B]">${item.school}</td>
          <td class="px-1 py-2.5 text-center">
            <span class="px-2 py-0.5 rounded-full text-[10px] border bg-[#FFF2E5] text-[#C88A6E] border-[#FCDCC7]">${item.level}</span>
          </td>
          <td class="px-2 py-2.5 text-center leading-tight">
            <div class="text-xs font-bold text-[#C88A6E]">${item.score}/${item.total}</div>
            <div class="text-[10px] text-[#A89288]">(${item.percent}%)</div>
          </td>
        </tr>
      `;
    }).join('');
  }
</script>
